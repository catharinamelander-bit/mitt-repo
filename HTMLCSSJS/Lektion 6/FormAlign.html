<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aligning Form Controll</title>
</head>
<body>
    <form action="#" method="post"
        <div>
            <label for="name" class="title">Name:</label>
            <input type="text" id="field" name="name" id="name">
        </div>
        <div>
            <label for="email" class="title">Email:</label>
            <input type="email" id="field" name="email" id="email">
        </div>
        <div>
            <span class="title">Gender:</span>
            <input type="radio" name="gender" id="male" value="m">
            <label for="male">M</label>

            <input type="radio" name="gender" id="female" value="f">
            <label for="female">F</label>

            <input type="radio"name="gender" id="none" value="none">
            <label for="none">Vill inte ange</label>
        </div>
        <div class="submit">
            <input type="submit" value="Register" id="">
                </div>
 </form>
    
</body>
</html>
